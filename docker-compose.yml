services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend1
      - backend2
      - backend3
  backend1:
    build: .
    container_name: backend1container
    expose:
      - "5000"
  backend2:
    build: .
    container_name: backend2container
    expose:
      - "5000"
  backend3:
    build: .
    container_name: backend3container
    expose:
      - "5000"
